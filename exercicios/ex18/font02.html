<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: "Love";
            src: url("fonts/Mf\ Love\ Song.ttf") format("truetype");
            font-weight: normal;
            font-style: normal;

        }

             /*
            Tipos de format()
            - opentyoe (otf)
            - truetype (ttf)
            - embedded-opentype
            - truetype-aat (Apple Advenced Typography)
            - svg



            */
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: "Love", Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>

</head>
<body>
    <h1>Olá, Mundo!</h1>
    <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Eos vitae error id libero ipsa corrupti cupiditate dolores, aut aperiam quis excepturi, voluptates molestias repudiandae eius illum eveniet cumque laborum nam?</p>
    
</body>
</html>
